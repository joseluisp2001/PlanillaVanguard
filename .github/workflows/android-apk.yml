name: Compilar APK Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        run: gradle assembleRelease --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk Sotspart.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Sotspart-apk
          path: android/Sotspart.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Sotspart (última versión)
          body: Descarga Sotspart.apk desde el teléfono e instálalo.
          prerelease: true
          files: android/Sotspart.apk
